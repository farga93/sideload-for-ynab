# Sideload for YNAB: local bank formats.
#
# Same format as bank2ynab.conf (https://github.com/bank2ynab/bank2ynab); [DEFAULT] values
# come from it, and a section here replaces a bank2ynab section of the same name.
# Only add a format here when bank2ynab's format cannot describe it: propose plain
# delimited-text formats to bank2ynab instead (see CONTRIBUTING.md).
#
# Extension keys:
#   Currency                 column role in "Input Columns": currency code of the row's amount.
#                            Without it, rows are in the account's currency.
#   Skip Rows Where          one rule per line, "<header> ~ <regex> [& <header> ~ <regex>] => <reason>".
#                            Headers are names from the file's last header row. Matching rows are
#                            listed as skipped, with the reason.
#   Sideload Parser          coded parser for a file that is not delimited text ("bcv").
#   Sideload First Non-Empty roles (comma-separated) whose repeated columns take the first
#                            non-empty cell instead of being joined with a space.
#   Sideload Account         YNAB account key the format feeds ("yuh", "bcv"), until accounts
#                            become configurable.
#   Sideload Detect Header   regex matched against the file's first line, to recognize the file
#                            whatever its name.

[CH BCV]
# BCV e-banking: "Liste des opérations" downloaded as xlsx.
# Filename-Pattern: LISTE DES OPÉRATIONS [14-11-2026].xlsx
Source Filename Pattern = LISTE DES OP
Source Filename Extension = .xlsx
Sideload Parser = bcv
Sideload Account = bcv

[CH Yuh]
# Yuh app: Account > Documents > Activities report (CSV)
# Same as bank2ynab's [CH Yuh] (pull request #532), plus the currency columns and skip rules.
# DATE;ACTIVITY TYPE;ACTIVITY NAME;DEBIT;DEBIT CURRENCY;CREDIT;CREDIT CURRENCY;CARD NUMBER;LOCALITY;RECIPIENT;SENDER;FEES/COMMISSION;BUY/SELL;QUANTITY;ASSET;PRICE PER UNIT
# DEBIT is already negative, so both DEBIT and CREDIT are read as Inflow.
# Memo is ACTIVITY NAME followed by LOCALITY. Payee is RECIPIENT, else SENDER, else the memo.
Use Regex For Filename = True
Source Filename Pattern = ^ACTIVITIES_REPORT-\d+(?=[^.]*\.[cC][sS][vV]$)
Source Filename Extension =
Source CSV Delimiter = ;
Input Columns = Date,skip,Memo,Inflow,Currency,Inflow,Currency,skip,Memo,Payee,Payee,skip,skip,skip,skip,skip
Sideload First Non-Empty = Payee
Date Format = %d/%m/%Y
Delete Source File = False
Skip Rows Where =
    ASSET ~ \S => Securities trade
    QUANTITY ~ \S => Securities trade
    BUY/SELL ~ \S => Securities trade
    DEBIT ~ \S & CREDIT ~ \S => Currency exchange
Sideload Account = yuh
Sideload Detect Header = ^DATE;ACTIVITY TYPE;ACTIVITY NAME;
